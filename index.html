<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>redvibegay4</title>
<style>
:root{--bg:#f0f2f5;--card:#fff;--tx:#1c1e21;--mu:#65676b;--bd:#dadde1;--bl:#1d9bf0;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#18191a;--card:#242526;--tx:#e4e6eb;--mu:#b0b3b8;--bd:#3e4042;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:600px;margin:0 auto;padding:0 10px 40px}
.cover{height:170px;background:linear-gradient(135deg,#e0245e,#7b2ff7) center/cover;border-radius:0 0 12px 12px}
.head{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-top:-30px;padding:14px;position:relative}
.av{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#e0245e,#7b2ff7) center/cover;color:#fff;font-size:34px;font-weight:700;display:flex;align-items:center;justify-content:center;border:3px solid var(--card);margin-top:-58px}
h1{font-size:20px;margin:6px 0 0;display:flex;align-items:center;gap:6px}
.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:8px}
button,a.btn{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 14px;background:var(--bg);color:var(--tx);font-weight:600;text-decoration:none;text-align:center}
.p{background:var(--bl);color:#fff}.on{background:var(--bd)}
.post{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-top:12px;overflow:hidden}
.pb{padding:12px 14px}.post img{width:100%;display:block}
.pr{display:flex;flex-wrap:wrap;gap:6px;padding:6px 10px;border-top:1px solid var(--bd)}.pr>*{flex:1;font-size:13px;padding:9px 6px}
.cm{padding:6px 14px;border-top:1px solid var(--bd)}.cm p{margin:2px 0}
.cf{display:flex;gap:6px;padding:8px 14px 12px;flex-wrap:wrap}
input,textarea{font:inherit;border:1px solid var(--bd);border-radius:8px;padding:8px;background:var(--bg);color:var(--tx);flex:1;min-width:0}
.comp{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-top:12px;padding:12px;display:grid;gap:8px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
.md{background:var(--card);border-radius:16px;padding:24px;max-width:340px;text-align:center}.md h2{margin:0 0 8px}.hide{display:none!important}a.mu{text-decoration:none;color:var(--mu);display:block}.rp{margin-left:22px;border-top:0}.rb{background:none;color:var(--mu);font-size:12px;padding:2px 6px;font-weight:600}.cm .cf{padding:6px 0}
.adm label{display:inline-block}.adm input[type=file]{display:none}
</style>
</head>
<body>
<div class="cover" id="cover"></div>
<div class="w">
 <div class="head">
  <div class="av" id="av">R</div>
  <h1>redvibegay4
   <svg width="20" height="20" viewBox="0 0 24 24" aria-label="Cuenta verificada"><path fill="#1d9bf0" d="M12 1.5l2.6 1.9 3.2-.1 1 3 2.6 1.9-1 3 1 3-2.6 1.9-1 3-3.2-.1L12 22.5l-2.6-1.9-3.2.1-1-3L2.6 15.8l1-3-1-3 2.6-1.9 1-3 3.2.1z"/><path fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M7.8 12.3l3 3 5.6-6"/></svg></h1>
  <div class="mu">Página oficial</div>
  <div class="row"><div><b id="fc">0</b> <span class="mu">seguidores</span></div><button id="fb" class="p">Seguir</button></div>
  <div class="row adm hide" id="pa">
   <label class="btn" style="background:var(--bg);padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer">📷 Foto de perfil<input type="file" accept="image/*" id="fav"></label>
   <label class="btn" style="background:var(--bg);padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer">🖼️ Portada<input type="file" accept="image/*" id="fcv"></label>
  </div>
 </div>
 <div id="comp" class="comp hide">
  <b>Nueva publicación (solo admin)</b>
  <textarea id="pt" rows="3" placeholder="Escribe algo..."></textarea>
  <input id="pf" type="file" accept="image/*">
  <button class="p" id="pub">Publicar</button><div class="mu" id="pm"></div>
 </div>
 <div id="back" class="hide" style="margin-top:12px"><button class="p" id="bk">← Volver al inicio</button></div>
 <div id="feed"></div>
 <div id="empty" class="mu" style="text-align:center;margin-top:24px">Aún no hay publicaciones.</div>
 <div style="text-align:center;margin-top:30px"><button id="lg" class="mu" style="background:none;font-weight:400">Admin</button></div>
</div>
<div class="ov" id="ov"><div class="md"><h2>Hola bienvenidos 👋</h2><p>Disfruta de las mejor fotos 🔥 del internet..</p><button class="p" id="ok">Entrar</button></div></div>

<script type="module">
// ===== 1) PEGA AQUÍ TU CONFIGURACIÓN DE FIREBASE =====
const firebaseConfig = {
  apiKey: "AIzaSyC2lrMjA4Rx41-MMzzM9NqX0LhrJr6bb-M",
  authDomain: "rebvibeg4.firebaseapp.com",
  projectId: "rebvibeg4",
  storageBucket: "rebvibeg4.firebasestorage.app",
  messagingSenderId: "566930330031",
  appId: "1:566930330031:web:97a8d8159e45fc9cb31f5a"
};
const ADMIN_EMAIL = "redvibegaypublicidad@gmail.com";   // el mismo que pondrás en las reglas
const PAYPAL = "https://www.paypal.com/ncp/payment/BA9JMJ8VGY6P6";
// =====================================================
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInAnonymously,signInWithPopup,GoogleAuthProvider,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,deleteDoc,addDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
const E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const S={posts:[],comments:[],likes:[],followers:[]};let uid=null,admin=false,prof={};
$("ok").onclick=()=>$("ov").classList.add("hide");
const err=e=>alert("No se pudo completar: "+(e&&e.message||e));
// Sin Firebase Storage: la foto se reduce y se guarda dentro de Firestore (gratis)
const upload=(f,max=1080)=>new Promise((ok,no)=>{const i=new Image(),u=URL.createObjectURL(f);
  i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");
    c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);
    let q=.8,d=c.toDataURL("image/jpeg",q);while(d.length>700000&&q>.3){q-=.1;d=c.toDataURL("image/jpeg",q)}
    URL.revokeObjectURL(u);d.length>900000?no(new Error("La imagen es demasiado grande")):ok(d)};
  i.onerror=()=>no(new Error("No se pudo leer la imagen"));i.src=u});
const safe=u=>/^(https:\/\/|data:image\/(jpeg|png|webp);base64,)/.test(u||"")?u:"";

onAuthStateChanged(auth,u=>{
  if(!u){signInAnonymously(auth).catch(err);return}
  uid=u.uid;admin=!u.isAnonymous&&u.email===ADMIN_EMAIL;
  $("comp").classList.toggle("hide",!admin);$("pa").classList.toggle("hide",!admin);
  $("lg").textContent=admin?"Cerrar sesión admin":"Admin";render();
});
$("lg").onclick=()=>admin?signOut(auth):signInWithPopup(auth,new GoogleAuthProvider()).catch(err);

onSnapshot(doc(db,"profile","main"),s=>{prof=s.data()||{};
  const a=safe(prof.avatar),c=safe(prof.cover);
  $("av").style.backgroundImage=a?`url("${a}")`:"";$("av").textContent=a?"":"R";
  $("cover").style.backgroundImage=c?`url("${c}")`:"";});
const setImg=(inp,field)=>$(inp).onchange=async e=>{const f=e.target.files[0];if(!f)return;
  try{await setDoc(doc(db,"profile","main"),{[field]:await upload(f,field==="avatar"?400:1000)},{merge:true})}catch(x){err(x)}};
setImg("fav","avatar");setImg("fcv","cover");

for(const k of Object.keys(S))onSnapshot(collection(db,k),s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()}));render()},err);
$("fb").onclick=()=>{if(!uid)return;const r=doc(db,"followers",uid);(S.followers.some(f=>f.id===uid)?deleteDoc(r):setDoc(r,{ts:Date.now()})).catch(err)};
$("pub").onclick=async()=>{const t=$("pt").value.trim(),f=$("pf").files[0];if(!t&&!f)return;
  $("pub").disabled=true;$("pm").textContent="Publicando...";
  try{await addDoc(collection(db,"posts"),{text:t,img:f?await upload(f):"",ts:Date.now()});$("pt").value="";$("pf").value="";$("pm").textContent=""}
  catch(e){$("pm").textContent="Error: "+(e.message||e)}$("pub").disabled=false};

const sendC=(postId,n,t,s,parentId)=>{const x=t.value.trim();if(!x||!uid)return;const nm=n.value.trim()||"Invitado";localStorage.setItem("nm",nm);s.disabled=true;
  const data={postId,name:nm,text:x,ts:Date.now()};if(parentId)data.parentId=parentId;
  addDoc(collection(db,"comments"),data).then(()=>{t.value=""}).catch(err).finally(()=>s.disabled=false)};
$("bk").onclick=()=>{history.pushState(null,"",location.pathname+location.search);render();scrollTo(0,0)};
addEventListener("hashchange",()=>{render();scrollTo(0,0)});

function render(){
  $("fc").textContent=S.followers.length;
  const me=S.followers.some(f=>f.id===uid);$("fb").textContent=me?"Siguiendo ✓":"Seguir";$("fb").className=me?"on":"p";
  const hid=decodeURIComponent(location.hash.slice(1)),single=!!hid&&S.posts.some(p=>p.id===hid);
  $("back").classList.toggle("hide",!single);$("comp").classList.toggle("hide",!admin||single);
  const feed=$("feed");feed.textContent="";let posts=[...S.posts].sort((a,b)=>b.ts-a.ts);if(single)posts=posts.filter(p=>p.id===hid);
  $("empty").classList.toggle("hide",posts.length>0);
  for(const p of posts){
    const el=E("div","post"),pb=E("div","pb");
    const dt=E("a","mu","redvibegay4 · "+new Date(p.ts).toLocaleString("es"));dt.href="#"+p.id;
    pb.append(dt,E("p",null,p.text||""));el.append(pb);
    if(safe(p.img)){const i=E("img");i.src=p.img;i.alt="";el.append(i)}
    const lk=S.likes.filter(l=>l.postId===p.id),liked=lk.some(l=>l.id===p.id+"_"+uid),r=E("div","pr");
    const b1=E("button",liked?"on":"","👍 "+lk.length);
    b1.onclick=()=>{if(!uid)return;const d=doc(db,"likes",p.id+"_"+uid);(liked?deleteDoc(d):setDoc(d,{postId:p.id})).catch(err)};
    const b2=E("a","btn","⭐ Enviar Estrellas");b2.href=PAYPAL;b2.target="_blank";b2.rel="noopener";
    const b3=E("button",null,"↗️ Compartir");
    b3.onclick=async()=>{const url=location.origin+location.pathname+"#"+p.id;
      try{if(navigator.share)await navigator.share({title:"redvibegay4",text:(p.text||"").slice(0,80),url});else{await navigator.clipboard.writeText(url);alert("Enlace copiado")}}catch(e){}};
    r.append(b1,b2,b3);el.append(r);
    if(admin){const x=E("button",null,"🗑️ Borrar");x.onclick=()=>confirm("¿Borrar publicación?")&&deleteDoc(doc(db,"posts",p.id)).catch(err);r.append(x)}
    const cs=S.comments.filter(c=>c.postId===p.id).sort((a,b)=>a.ts-b.ts);
    const draw=(c,top,isReply)=>{
      const d=E("div","cm"+(isReply?" rp":"")),q=E("p");q.append(E("b",null,c.name+" "),document.createTextNode(c.text));d.append(q);
      const rb=E("button","rb","Responder");
      rb.onclick=()=>{if(d.querySelector(".rf"))return;const rf=E("div","cf rf"),rn=E("input"),rt=E("input"),rs=E("button","p","Enviar");
        rn.placeholder="Tu nombre";rn.maxLength=30;rn.value=localStorage.getItem("nm")||"";rt.placeholder="Responder a "+c.name+"...";rt.maxLength=500;
        rs.onclick=()=>sendC(p.id,rn,rt,rs,top.id);rf.append(rn,rt,rs);d.append(rf);rt.focus()};
      d.append(rb);
      if(admin){const x=E("button","rb","🗑️");x.onclick=()=>confirm("¿Borrar comentario?")&&deleteDoc(doc(db,"comments",c.id)).catch(err);d.append(x)}
      el.append(d)};
    cs.filter(c=>!c.parentId).forEach(t=>{draw(t,t,false);cs.filter(c=>c.parentId===t.id).forEach(c=>draw(c,t,true))});
    const f=E("div","cf"),n=E("input"),t=E("input"),sb=E("button","p","Enviar");
    n.placeholder="Tu nombre (invitado)";n.maxLength=30;n.value=localStorage.getItem("nm")||"";t.placeholder="Escribe un comentario...";t.maxLength=500;
    sb.onclick=()=>sendC(p.id,n,t,sb,null);
    f.append(n,t,sb);el.append(f);feed.append(el);
   <script data-cfasync="false" src="https://ahuramazda.org/1/a9e31dacbfac71860684e217e832634c"></script>
  }
}
</script>
</body>
</html>
